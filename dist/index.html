<title>모션 브리프 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@300;700&family=Black+Han+Sans&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: NLE-style workspace — sticky top bar with step rail; per-step views; editor = scene list | stage | inspector over a full-width timeline. */
:root{
  --bg:#EEF0F4; --panel:#FFFFFF; --panel-2:#F6F7FA; --sunk:#E4E7ED; --line:#D5D9E2; --line-2:#C4CAD6;
  --fg:#141821; --fg-2:#3B4252; --muted:#687186; --faint:#98A0B1;
  --accent:#2747E8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FF; --accent-line:#A9B8FF;
  --key:#E8A200; --key-soft:#FFF2CC;
  --ok:#11845B; --ok-soft:#DDF3EA; --warn:#B85C00; --warn-soft:#FFEBD6; --bad:#C62E3A; --bad-soft:#FBE3E5;
  --stage:#0B0D12; --stage-line:#232836;
  --src-user:#5B6477; --src-web:#C8613F; --src-code:#8A4FD8; --src-chat:#D08A1F; --src-git:#1F2937; --src-import:#0E8A86;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 6px 24px rgba(20,24,33,.08);
  --shadow-lg:0 12px 48px rgba(20,24,33,.22);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --left:236px; --right:clamp(340px,25vw,480px); --tl:clamp(196px,27vh,340px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1015; --panel:#161920; --panel-2:#1B1F27; --sunk:#0B0D11; --line:#272C37; --line-2:#363D4B;
  --fg:#E9ECF2; --fg-2:#C3C9D5; --muted:#8C94A6; --faint:#5E6677;
  --accent:#7D93FF; --accent-ink:#0B0F25; --accent-soft:#1D2547; --accent-line:#3B4A93;
  --key:#F5B829; --key-soft:#3A2E0D;
  --ok:#3CC48E; --ok-soft:#10301F; --warn:#F09A4A; --warn-soft:#3A2410; --bad:#F06B75; --bad-soft:#3A1519;
  --stage:#06070A; --stage-line:#1D212B;
  --src-user:#8C94A6; --src-web:#E07B58; --src-code:#A985F0; --src-chat:#E2A445; --src-git:#C9D1D9; --src-import:#33B8B2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); --shadow-lg:0 16px 60px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1015; --panel:#161920; --panel-2:#1B1F27; --sunk:#0B0D11; --line:#272C37; --line-2:#363D4B;
  --fg:#E9ECF2; --fg-2:#C3C9D5; --muted:#8C94A6; --faint:#5E6677;
  --accent:#7D93FF; --accent-ink:#0B0F25; --accent-soft:#1D2547; --accent-line:#3B4A93;
  --key:#F5B829; --key-soft:#3A2E0D;
  --ok:#3CC48E; --ok-soft:#10301F; --warn:#F09A4A; --warn-soft:#3A2410; --bad:#F06B75; --bad-soft:#3A1519;
  --stage:#06070A; --stage-line:#1D212B;
  --src-user:#8C94A6; --src-web:#E07B58; --src-code:#A985F0; --src-chat:#E2A445; --src-git:#C9D1D9; --src-import:#33B8B2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); --shadow-lg:0 16px 60px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px} svg.i.l{width:20px;height:20px}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:padding-box} ::-webkit-scrollbar-track{background:transparent}

/* ---------- app frame ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-width:0}
.top{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30;min-width:0}
.logo{display:flex;align-items:center;gap:9px;border:0;background:none;padding:4px 6px 4px 2px;border-radius:8px;cursor:pointer;color:var(--fg)}
.logo:hover{background:var(--panel-2)}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--fg);display:grid;place-items:center;flex:none}
.logo-mark svg{width:16px;height:16px}
.logo-word{font:800 15px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.vbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 8px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel-2);cursor:pointer;white-space:nowrap}
.vbtn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.vbtn b{font:600 13px var(--f-mono)}
.vbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--src-user)}
.vbtn .chg{font:500 11px var(--f-mono);color:var(--warn);background:var(--warn-soft);padding:2px 6px;border-radius:99px}
.ptitle{min-width:80px;max-width:280px;flex:0 1 auto;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 8px;font-weight:600;font-size:14px;text-overflow:ellipsis}
.ptitle:hover{border-color:var(--line)} .ptitle:focus{border-color:var(--accent);background:var(--panel);outline:none}
.steps{display:flex;align-items:center;gap:2px;margin-inline:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
.step{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 6px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.step .n{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:600 11px var(--f-mono);background:var(--sunk);color:var(--muted)}
.step:hover{color:var(--fg)}
.step.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--ok-soft);color:var(--ok)}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.savestate{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.savestate.busy i{background:var(--key)} .savestate.err i{background:var(--bad)}
main{min-height:0;min-width:0;position:relative}
.view{height:100%;overflow:auto;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--panel-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ai{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ai:hover{filter:brightness(1.2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px;gap:5px}
.btn.lg{height:42px;padding:0 18px;font-size:14px;border-radius:11px}
.btn.danger{color:var(--bad)}
.btn kbd{font:500 10.5px var(--f-mono);opacity:.7;margin-left:2px}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--fg-2);flex:none}
.ibtn:hover{background:var(--panel-2);border-color:var(--line)}
.ibtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.ibtn.sm{width:26px;height:26px;border-radius:6px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:6px;justify-content:space-between}
.lbl .hint,.field .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.in,.ta,.sel{width:100%;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0;transition:border-color .12s,box-shadow .12s}
.in:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:64px;line-height:1.6}
.in::placeholder,.ta::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-size:12.5px;white-space:nowrap;color:var(--fg-2)}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .x{opacity:.6}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:none;height:28px;padding:0 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-6px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.range-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:11.5px;color:var(--muted)}
.range-row b{font:600 12px var(--f-mono);color:var(--fg);min-width:38px;text-align:right}
input[type=color]{width:34px;height:30px;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--panel);cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.sw span{font-size:12px;color:var(--fg-2)} .sw .mono{font-size:11px;color:var(--muted);margin-left:auto}
.toggle{position:relative;width:34px;height:20px;border-radius:99px;background:var(--line-2);border:0;cursor:pointer;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{transform:translateX(14px)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.src{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:5px;font:600 10.5px var(--f-mono);letter-spacing:.02em;color:#fff;background:var(--src-user);white-space:nowrap}
.src::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.src.web{background:var(--src-web)} .src.code{background:var(--src-code)} .src.chat{background:var(--src-chat)} .src.git{background:var(--src-git);color:var(--bg)} .src.import{background:var(--src-import)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l)}
.sec{display:grid;gap:14px;padding:20px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sec-h h3{font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.divider{height:1px;background:var(--line);margin:4px 0}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:36px 20px;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r-l)}
.empty h4{color:var(--fg);font-size:14px}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-m);padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .12s,background .12s;display:grid;gap:6px;place-items:center}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kbd{font:500 11px var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel-2)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.hero h1{font:800 clamp(28px,3.3vw,44px)/1.08 var(--f-display);letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--fg-2);font-size:14px;max-width:56ch;margin-top:12px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:14px}
.flow>div{padding:16px 14px 16px;border-right:1px solid var(--line);display:grid;gap:6px;align-content:start;position:relative}
.flow>div:last-child{border-right:0}
.flow .n{font:800 26px/1 var(--f-display);color:var(--accent);letter-spacing:-.04em}
.flow h4{font-size:13.5px}
.flow p{font-size:12px;color:var(--muted);line-height:1.5}
.flow .out{margin-top:4px;font:500 11px var(--f-mono);color:var(--fg-2);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;justify-self:start}
.loop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-l);background:var(--accent-soft);color:var(--fg-2);font-size:12.5px;margin-bottom:28px}
.loop b{color:var(--fg)}
.loop .arr{color:var(--accent);font-weight:700}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:border-color .12s,box-shadow .12s}
.pcard:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.pstrip{height:70px;display:flex;background:var(--stage);gap:2px;padding:2px}
.pstrip i{flex:1;border-radius:3px;background-size:cover;background-position:center}
.pbody{padding:12px 14px;display:grid;gap:6px}
.pbody h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}

/* ---------- brief / script ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h2{font:800 26px/1.1 var(--f-display);letter-spacing:-.03em}
.page-h p{color:var(--muted);margin-top:6px;max-width:70ch}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.bgrid .span{grid-column:1/-1}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stycard{border:1px solid var(--line-2);border-radius:10px;padding:8px;background:var(--panel);cursor:pointer;text-align:left;display:grid;gap:6px}
.stycard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stycard .pv{height:44px;border-radius:6px;position:relative;overflow:hidden}
.stycard b{font-size:12px} .stycard span{font-size:11px;color:var(--muted);line-height:1.35}
.dock{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px;margin-top:20px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);flex-wrap:wrap}
.dock .msg{margin-right:auto;font-size:12.5px;color:var(--muted)}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ref{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2);display:grid;grid-template-rows:auto 1fr}
.ref .th{aspect-ratio:16/10;background:var(--sunk);display:grid;place-items:center;color:var(--faint);position:relative;overflow:hidden}
.ref .th img,.ref .th video{width:100%;height:100%;object-fit:cover;display:block}
.ref .th .k{position:absolute;left:6px;top:6px;font:600 10px var(--f-mono);background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:4px}
.ref .rb{padding:7px 8px;display:grid;gap:5px}
.ref .rb input{font-size:11.5px;padding:4px 6px;border:1px solid transparent;border-radius:5px;background:transparent;width:100%}
.ref .rb input:focus{border-color:var(--accent);background:var(--panel);outline:none}
.ref .rb .row{justify-content:space-between}
.script-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.sticky{position:sticky;top:12px}
.sblock{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);margin-bottom:12px}
.sblock-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sblock-h .no{font:800 18px/1 var(--f-display);color:var(--accent);width:30px;letter-spacing:-.03em}
.sblock-h .chap{width:110px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.sblock-h .ttl{flex:1;min-width:120px;font-weight:600}
.sblock-h input{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px}
.sblock-h input:hover{border-color:var(--line)} .sblock-h input:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.sblock-b{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;padding:12px}
.langcols{display:grid;gap:8px}
.lng{display:grid;gap:4px}
.lng .lt{display:flex;align-items:center;gap:6px;font:600 10.5px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.lng .ta{min-height:0;font-size:13.5px;line-height:1.7}
.lng.ko .ta{font-size:14px}
.mismatch{color:var(--warn);font-weight:600}
.meter{height:8px;background:var(--sunk);border-radius:8px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:8px}
.meter.over i{background:var(--warn)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.stat b{display:block;font:600 18px/1.2 var(--f-mono)}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- narration ---------- */
.ncols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.copybox{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.copybox pre{margin:0;padding:12px 14px;max-height:340px;overflow:auto;white-space:pre-wrap;font:13px/1.75 var(--f-ui);color:var(--fg)}
.copybox .bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line)}
.copybox .bar .eyebrow{margin-right:auto;padding-left:4px}
.wave{width:100%;height:120px;display:block;background:var(--sunk);border-radius:10px}
.ltable{width:100%;border-collapse:collapse;font-size:12.5px}
.ltable th{font:600 10.5px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.ltable td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ltable td.txt{width:100%}
.ltable input{width:70px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font:12px var(--f-mono);background:var(--panel)}
.ltable tr.cur{background:var(--accent-soft)}
.tbl-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}

/* ---------- editor ---------- */
.ed{height:100%;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);grid-template-rows:minmax(0,1fr) var(--tl);min-height:0}
.slist{grid-row:1;grid-column:1;border-right:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.slist-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.slist-b{overflow:auto;padding:8px;display:grid;gap:6px;align-content:start}
.sitem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:9px;padding:6px;border-radius:9px;border:1px solid transparent;cursor:pointer;text-align:left;background:none;align-items:center;position:relative}
.sitem:hover{background:var(--panel-2)}
.sitem.on{background:var(--accent-soft);border-color:var(--accent-line)}
.sitem .th{width:56px;height:34px;border-radius:5px;background:var(--stage);background-size:cover;background-position:center;position:relative;overflow:hidden}
.sitem .th b{position:absolute;left:4px;bottom:2px;font:700 11px var(--f-mono);color:#fff;text-shadow:0 1px 2px #000}
.sitem .t{padding-right:14px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .m{font:11px var(--f-mono);color:var(--muted);display:flex;gap:6px;align-items:center}
.sitem .st{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:inline-block}
.sitem .st.review{background:var(--key)} .sitem .st.final{background:var(--ok)}
.sitem .badge{position:absolute;right:6px;top:6px;font:600 10px var(--f-mono);background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 5px}
.slist-f{padding:8px;border-top:1px solid var(--line)}
.stage{grid-row:1;grid-column:2;background:var(--stage);display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.canvas-wrap{display:grid;place-items:center;padding:16px;min-height:0;min-width:0;position:relative}
.canvas-wrap canvas{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#000;display:block}
.ptool{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--stage-line);color:#C9CED8;flex-wrap:wrap}
.ptool .ibtn{color:#C9CED8} .ptool .ibtn:hover{background:#1A1E27;border-color:#2A2F3B} .ptool .ibtn.on{background:#22305E;color:#B9C6FF;border-color:#3B4A93}
.ptool .tc{font:500 13px var(--f-mono);color:#fff;margin:0 8px;letter-spacing:.02em}
.ptool .tc span{color:#6B7385}
.ptool .seg{background:#161A22} .ptool .seg button{color:#8D95A6} .ptool .seg button[aria-pressed="true"]{background:#2A3140;color:#fff;box-shadow:none}
.ptool .lab{font-size:11px;color:#6B7385;margin-left:6px}
.ptool select{background:#161A22;border:1px solid #2A2F3B;border-radius:7px;color:#C9CED8;height:28px;padding:0 6px;font-size:12px}
.insp{grid-row:1/3;grid-column:3;border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto auto 1fr;min-height:0;min-width:0}
.insp-h{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.insp-h .row1{display:flex;align-items:center;gap:8px}
.insp-h .no{font:800 22px/1 var(--f-display);color:var(--accent);letter-spacing:-.03em}
.insp-h .tt{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 10px 9px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .cnt{font:600 10px var(--f-mono);background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 5px}
.insp-b{overflow:auto;padding:14px;display:grid;gap:18px;align-content:start}
.grp{display:grid;gap:10px}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grp-h h5{margin:0;font-size:11px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lcard{border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:8px;display:grid;gap:5px}
.lcard .lh{display:flex;align-items:center;gap:6px;font:11px var(--f-mono);color:var(--muted)}
.lcard .lh b{color:var(--fg-2)}
.lcard .lrow{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:start}
.lcard .lrow span{font:600 10px/26px var(--f-mono);color:var(--faint)}
.lcard textarea{border:1px solid transparent;background:var(--panel);border-radius:6px;padding:4px 7px;resize:none;min-height:28px;line-height:1.55;width:100%;font-size:13px;field-sizing:content}
.lcard textarea:focus{border-color:var(--accent);outline:none}
.lcard.cur{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.still{position:relative;border-radius:9px;overflow:hidden;background:var(--sunk);aspect-ratio:16/9;cursor:crosshair}
.still img{width:100%;height:100%;object-fit:cover;display:block}
.still .fp{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.5);pointer-events:none}
.still .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:12px;cursor:pointer;gap:4px;align-content:center}
.optgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.opt{border:1px solid var(--line-2);border-radius:9px;background:var(--panel);cursor:pointer;padding:8px 4px 6px;display:grid;place-items:center;gap:4px;font-size:11px;color:var(--fg-2);text-align:center;line-height:1.2}
.opt svg{width:22px;height:22px}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.dots{display:flex;gap:6px}
.dots button{flex:1;height:30px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font:600 12px var(--f-mono);color:var(--muted)}
.dots button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots button.lv{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mood{border:1px solid var(--line-2);border-radius:9px;background:var(--panel);padding:7px 8px;cursor:pointer;text-align:left;display:grid;gap:2px}
.mood b{font-size:12px} .mood span{font-size:10.5px;color:var(--muted);line-height:1.3}
.mood:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.note{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
.note.done{opacity:.55} .note.done .nt{text-decoration:line-through}
.note .nt{font-size:12.5px;white-space:pre-wrap}
.note .nm{font:10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.note input[type=checkbox]{margin-top:3px;accent-color:var(--accent)}

/* timeline */
.tl{grid-row:2;grid-column:1/3;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.tl-h{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl-h .eyebrow{margin-right:6px}
.tl-body{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:0;overflow-y:auto;overflow-x:hidden}
.tl-labels{border-right:1px solid var(--line);display:grid;grid-auto-rows:min-content;background:var(--panel-2)}
.tl-labels div{height:var(--h);display:flex;align-items:center;padding:0 10px;font:600 10.5px var(--f-mono);letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);gap:5px}
.tl-scroll{overflow-x:auto;overflow-y:hidden;position:relative;min-width:0}
.tl-inner{position:relative;min-width:100%}
.trk{height:var(--h);position:relative;border-bottom:1px solid var(--line)}
.ruler{background:var(--panel-2);cursor:pointer}
.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-2)}
.ruler i span{position:absolute;left:3px;top:3px;font:10px var(--f-mono);color:var(--muted);white-space:nowrap}
.blk{position:absolute;top:4px;bottom:4px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent-line);overflow:hidden;cursor:pointer;padding:3px 7px;font-size:11.5px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.blk b{font:700 10.5px var(--f-mono);color:var(--accent)}
.blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2);font-weight:500}
.blk.on{background:var(--accent);border-color:var(--accent)}
.blk.on b,.blk.on span{color:var(--accent-ink)}
.blk .lk{position:absolute;right:5px;top:4px;opacity:.7}
.hdl{position:absolute;top:0;bottom:0;width:10px;margin-left:-5px;cursor:ew-resize;z-index:3}
.hdl::after{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--fg-2);opacity:0;transition:opacity .1s}
.hdl:hover::after,.hdl.drag::after{opacity:1}
.sub{position:absolute;top:5px;bottom:5px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line-2);font-size:11px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:22px;color:var(--fg-2)}
.sub.cur{border-color:var(--key);background:var(--key-soft)}
.trk canvas{position:absolute;inset:0;width:100%;height:100%}
.hit{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);border:1.5px solid var(--key);background:var(--panel);cursor:pointer;z-index:2}
.hit.on{background:var(--key)}
.phead{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bad);z-index:6;pointer-events:none}
.phead::before{content:"";position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:8px solid var(--bad)}
.tl-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted);pointer-events:none}

/* ---------- export ---------- */
.xgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.x8{grid-column:span 7} .x4{grid-column:span 5} .x6{grid-column:span 6} .x12{grid-column:1/-1}
.mdpre{margin:0;padding:14px 16px;max-height:460px;overflow:auto;font:12px/1.65 var(--f-mono);white-space:pre-wrap;color:var(--fg-2);background:var(--panel-2);border-top:1px solid var(--line);border-radius:0 0 var(--r-l) var(--r-l)}
.thumbcv{width:100%;height:auto;display:block;border-radius:8px;background:var(--stage);aspect-ratio:16/9}
.recv{width:100%;border-radius:8px;background:var(--stage);display:block}
.prog{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--bad);width:0}
.dlrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dlrow:last-child{border-bottom:0}
.dlrow .ft{font:600 11px var(--f-mono);background:var(--sunk);color:var(--fg-2);border-radius:5px;padding:3px 6px;width:44px;text-align:center}
.dlrow .dt{flex:1;min-width:0} .dlrow .dt b{display:block;font-size:13px} .dlrow .dt span{font-size:11.5px;color:var(--muted)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .14s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100% - 20px);display:grid;grid-template-rows:auto 1fr auto;min-height:0;animation:pop .16s}
.modal.wide{width:min(1120px,100%)} .modal.mid{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
.modal-h h3{font-size:16px;flex:1}
.modal-b{overflow:auto;padding:4px 18px 18px;display:grid;gap:14px;align-content:start;min-height:0}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.modal-f .msg{margin-right:auto;font-size:12px;color:var(--muted)}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(440px,100%);background:var(--panel);border-right:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:61;display:grid;grid-template-rows:auto auto 1fr;animation:slide .18s;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h h3{flex:1;font-size:15px}
.vfilter{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.vlist{overflow:auto;padding:8px 10px 24px}
.vrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 6px;border-radius:10px;position:relative}
.vrow:hover{background:var(--panel-2)}
.vrow .rail{display:grid;justify-items:center;grid-template-rows:auto 1fr}
.vrow .rail i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);margin-top:4px}
.vrow .rail b{width:2px;background:var(--line);margin-top:4px}
.vrow.cur .rail i{border-color:var(--accent);background:var(--accent)}
.vrow .vh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vrow .vn{font:700 13px var(--f-mono)}
.vrow .vl{font-weight:600}
.vrow .vt{font:11px var(--f-mono);color:var(--muted);margin-left:auto}
.vrow ul{margin:6px 0 0;padding-left:16px;color:var(--fg-2);font-size:12px;display:grid;gap:1px}
.vrow .vnote{font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.vrow .vact{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.vrow .att{display:flex;gap:5px;margin-top:6px}
.vdraft{margin:4px 6px 10px;padding:10px 12px;border:1px dashed var(--warn);border-radius:10px;background:var(--warn-soft);display:flex;align-items:center;gap:10px;font-size:12.5px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:90}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;display:flex;gap:10px;align-items:center;max-width:420px;animation:pop .16s}
.toast.err{background:var(--bad);color:#fff}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.ai-out{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:12px;max-height:260px;overflow:auto;white-space:pre-wrap;font:12px/1.6 var(--f-mono);color:var(--fg-2)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:inline-block}
.banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--key-soft);color:var(--fg);font-size:12.5px;border-bottom:1px solid var(--line)}
.diff{display:grid;gap:8px}
.diff .d{border:1px solid var(--line);border-radius:9px;padding:9px 10px;display:grid;gap:4px}
.diff .d h6{margin:0;font-size:12px}
.diff del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;border-radius:3px;padding:0 2px}
.diff ins{background:var(--ok-soft);color:var(--ok);text-decoration:none;border-radius:3px;padding:0 2px}
.help-steps{display:grid;gap:10px;counter-reset:s}
.help-steps>div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.help-steps .n{font:800 22px/1 var(--f-display);color:var(--accent)}
.help-steps h4{font-size:13.5px} .help-steps p{font-size:12.5px;color:var(--muted)}
.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;align-items:center}

/* BGM */
.bgm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.preset{border:1px solid var(--line-2);border-radius:11px;padding:10px;background:var(--panel);cursor:pointer;text-align:left;display:grid;gap:3px}
.preset b{font-size:12.5px} .preset span{font-size:11px;color:var(--muted);line-height:1.35}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.moodpad{position:relative;aspect-ratio:1.45/1;border-radius:12px;border:1px solid var(--line-2);cursor:crosshair;touch-action:none;overflow:hidden;background:
  radial-gradient(circle at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%),
  radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--key) 30%,transparent),transparent 55%),
  radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--bad) 22%,transparent),transparent 55%),
  radial-gradient(circle at 0% 100%,color-mix(in srgb,var(--src-code) 22%,transparent),transparent 55%),var(--panel-2)}
.moodpad::before,.moodpad::after{content:"";position:absolute;background:var(--line-2)}
.moodpad::before{left:50%;top:0;bottom:0;width:1px} .moodpad::after{top:50%;left:0;right:0;height:1px}
.moodpad .q{position:absolute;font-size:11.5px;font-weight:600;color:var(--fg-2);pointer-events:none;display:grid;gap:1px}
.moodpad .q span{font-weight:400;color:var(--muted);font-size:10.5px}
.moodpad .ax{position:absolute;font:600 10px var(--f-mono);color:var(--muted);letter-spacing:.08em;pointer-events:none}

.arc .bar{align-self:end;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 45%,transparent))}
.arc .lb{font:600 10px var(--f-mono);color:var(--muted);text-align:center}
.arc .hitb{justify-self:center;width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--key);background:var(--panel);cursor:pointer;padding:0}

.bpm{display:flex;align-items:center;gap:10px}
.bpm b{font:700 28px/1 var(--f-display);letter-spacing:-.03em;min-width:62px}

.briefout{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px 12px;font-size:12.5px;line-height:1.65;white-space:pre-wrap}

/* timing */
function estDur(s,rate){const ch=s.lines.reduce((a,l)=>a+nonspace(l.ko),0);if(!ch)return 3;const nl=s.lines.filter(l=>l.ko.trim()).length;return Math.max(2.5,ch/(rate||6)+nl*0.32+1.0)}
function timeline(p){const rate=p.voice.speechRate||6;let t=0;const segs=[];
 p.scenes.forEach((s,i)=>{let st=s.start!=null?s.start:t;let en=s.end!=null?s.end:st+estDur(s,rate);if(en<st+0.3)en=st+0.3;segs.push({i,s,start:st,end:en});t=en});
 const lines=[];
 segs.forEach(g=>{const ls=g.s.lines;const timed=ls.length&&ls.every(l=>l.start!=null&&l.end!=null);
  if(timed){ls.forEach(l=>lines.push({g,l,start:l.start,end:l.end}))}
  else{const act=ls.filter(l=>l.ko.trim()||l.ja||l.en);const tot=act.reduce((a,l)=>a+Math.max(1,nonspace(l.ko)),0)||1;const a0=g.start+0.35,a1=Math.max(a0+0.5,g.end-0.4);const span=a1-a0;let c=a0;const gap=Math.min(0.25,span*0.04);
   act.forEach(l=>{const d=span*(Math.max(1,nonspace(l.ko))/tot);lines.push({g,l,start:c,end:c+d-gap,est:true});c+=d})}});
 let total=segs.length?segs[segs.length-1].end:0;
 return {segs,lines,total,aligned:p.scenes.every(s=>s.start!=null&&s.end!=null)}}
function materialize(p){const tl=timeline(p);tl.segs.forEach(g=>{g.s.start=+g.start.toFixed(3);g.s.end=+g.end.toFixed(3)})}

/* audio asset wrapper: audio types are not accepted as-is, so wrap as JSON */
async function uploadAudio(file){
 if(file.size>14.5*1024*1024)throw {code:'too_large',message:'오디오는 14MB 이하만 저장할 수 있어요 (WAV라면 MP3/M4A로 변환 권장).'};
 const b64=await blobToB64(file);
 const wrapped=new Blob([JSON.stringify({mbsAudio:1,name:file.name,mime:file.type||'audio/wav',b64})],{type:'application/json'});
 const id=await Store.upload(wrapped,'application/json');
 AUD.bytes[id]={bytes:b64ToBytes(b64),name:file.name,mime:file.type||'audio/wav'};
 return id}
const AUD={buf:{},bytes:{},pending:{}};
async function audioBytes(id){if(AUD.bytes[id])return AUD.bytes[id];const blob=await Store.fetchBlob(id);const j=JSON.parse(await blob.text());AUD.bytes[id]={bytes:b64ToBytes(j.b64),name:j.name,mime:j.mime};return AUD.bytes[id]}
async function audioBuffer(id){if(!id)return null;if(AUD.buf[id])return AUD.buf[id];if(AUD.pending[id])return AUD.pending[id];
 AUD.pending[id]=(async()=>{const {bytes}=await audioBytes(id);const ctx=actx();const buf=await ctx.decodeAudioData(bytes.slice(0).buffer);AUD.buf[id]=buf;return buf})();
 try{return await AUD.pending[id]}finally{delete AUD.pending[id]}}
let _actx=null;function actx(){if(!_actx)_actx=new (window.AudioContext||window.webkitAudioContext)();return _actx}

function findRef(scope,rid){const list=scope==='p'?S.proj.refs:(S.proj.scenes.find(x=>x.id===scope)||{refs:[]}).refs;return list.find(r=>r.id===rid)}
function resolve(path){let root,rest;
 if(path.startsWith('p.')){root=S.proj;rest=path.slice(2)}
 else if(path.startsWith('s.')){root=cur();rest=path.slice(2)}
 else if(path.startsWith('ui.')){root=S;rest=path.slice(3)}
 else if(path.startsWith('S:')){const i=path.indexOf('.');const sid=path.slice(2,i);root=S.proj.scenes.find(x=>x.id===sid);rest=path.slice(i+1)}
 else if(path.startsWith('L:')){const i=path.indexOf('.');const [sid,lid]=path.slice(2,i).split(':');const sc=S.proj.scenes.find(x=>x.id===sid);root=sc&&sc.lines.find(l=>l.id===lid);rest=path.slice(i+1)}
 else if(path.startsWith('R:')){const i=path.indexOf('.');const [scope,rid]=path.slice(2,i).split(':');root=findRef(scope,rid);rest=path.slice(i+1)}
 if(!root)return [null,null];const ks=rest.split('.');let o=root;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}return [o,ks[ks.length-1]]}
function getPath(path){const [o,k]=resolve(path);return o?o[k]:undefined}
function setPath(path,v){const [o,k]=resolve(path);if(!o)return false;o[k]=v;return true}

const pushUndo=debounce(()=>{if(!S.proj)return;const j=JSON.stringify(S.proj);if(S.undo[S.undo.length-1]===j)return;S.undo.push(j);if(S.undo.length>80)S.undo.shift();S.redo=[];S.dirty++;renderTop()},500);
function touch(path,{structural=false}={}){if(!S.proj)return;
 S.proj.updatedAt=Date.now();pushUndo();scheduleSave();
 if(structural)refresh();else{live();Player.redrawAll();if(S.view==='edit'&&/^(s\.|S:|L:)/.test(path||''))renderTimeline()}}
function undo(){pushUndo.flush();if(S.undo.length<2)return toast('되돌릴 변경이 없어요');S.redo.push(S.undo.pop());S.proj=norm(JSON.parse(S.undo[S.undo.length-1]));scheduleSave();refresh();toast('되돌렸어요')}
function redo(){if(!S.redo.length)return;const j=S.redo.pop();S.undo.push(j);S.proj=norm(JSON.parse(j));scheduleSave();refresh();toast('다시 적용했어요')}

function metaOf(p){const tl=timeline(p);return {title:p.title,stage:p.stage,updatedAt:p.updatedAt,createdAt:p.createdAt,scenes:p.scenes.length,duration:+tl.total.toFixed(1),aspect:p.brief.aspect,palette:p.brief.palette,stills:p.scenes.slice(0,8).map(s=>s.still&&s.still.assetId||null),lastV:(S.versions[0]&&S.versions[0].n)||0,example:!!p.example,thumb:(p.thumb&&p.thumb.assetId)||null}}

async function saveNow(){if(!S.proj||!S.pid)return;const p=S.proj;S.save='busy';renderSave();

  await Store.saveDraft(S.pid,{...p,_writer:CLIENT});const m=metaOf(p);const mj=JSON.stringify(m);if(mj!==_lastMeta){await Store.saveMeta(S.pid,m);_lastMeta=mj}
  S.save='ok';S.savedAt=Date.now()}catch(e){S.save='err';toast(e&&e.code==='invalid_argument'&&!e.message?'저장 권한이 없어 저장되지 않았어요.':errMsg(e),{err:true})}renderSave()}

function renderBanner(){const b=$('#banner');if(!b)return;b.hidden=!S.remoteBanner;if(S.remoteBanner)b.innerHTML=`${ic('history')}<span>다른 창이나 사용자가 이 프로젝트를 수정했어요.</span><span class="sp"></span><button class="btn sm" data-act="loadRemote">최신 내용 불러오기</button><button class="btn sm ghost" data-act="dismissRemote">무시</button>`}
function diffSummary(a,b){if(!a)return ['첫 버전'];const out=[];
 if(a.title!==b.title)out.push('제목 변경');
 if(JSON.stringify(a.brief)!==JSON.stringify(b.brief))out.push('기획 수정');
 const ai=new Map(a.scenes.map((s,i)=>[s.id,s]));const bi=new Set(b.scenes.map(s=>s.id));
 const add=b.scenes.filter(s=>!ai.has(s.id)).length,rem=a.scenes.filter(s=>!bi.has(s.id)).length;
 if(add)out.push(`씬 ${add}개 추가`);if(rem)out.push(`씬 ${rem}개 삭제`);
 if(!add&&!rem&&a.scenes.map(s=>s.id).join()!==b.scenes.map(s=>s.id).join())out.push('씬 순서 변경');
 b.scenes.forEach((s,i)=>{const o=ai.get(s.id);if(!o)return;const ch=[];
  const txt=x=>x.lines.map(l=>l.ko+'|'+l.ja+'|'+l.en).join('/');
  if(txt(o)!==txt(s))ch.push('나레이션');
  if(o.lines.map(l=>l.start+'-'+l.end).join()!==s.lines.map(l=>l.start+'-'+l.end).join()||o.start!==s.start||o.end!==s.end)ch.push('타이밍');
  if(JSON.stringify(o.onscreen)!==JSON.stringify(s.onscreen))ch.push('화면 텍스트');
  if(o.intent!==s.intent||o.visual!==s.visual||o.title!==s.title||o.chapter!==s.chapter)ch.push('의도·비주얼');
  if(JSON.stringify(o.dir)!==JSON.stringify(s.dir)||o.bgmHit!==s.bgmHit)ch.push('연출');
  if(JSON.stringify(o.still)!==JSON.stringify(s.still))ch.push('스틸');
  if(o.refs.length!==s.refs.length)ch.push('레퍼런스');
  if(o.notes.length!==s.notes.length||o.notes.filter(n=>n.done).length!==s.notes.filter(n=>n.done).length)ch.push('수정 지시');
  if(o.status!==s.status||o.locked!==s.locked)ch.push('상태');
  if(ch.length)out.push(`씬 ${i+1} ${ch.join('·')}`)});
 if(JSON.stringify(a.bgm)!==JSON.stringify(b.bgm))out.push('BGM 설정');
 if(JSON.stringify(a.narration&&a.narration.assetId)!==JSON.stringify(b.narration&&b.narration.assetId))out.push('나레이션 오디오');
 if(JSON.stringify(a.langs)!==JSON.stringify(b.langs)||JSON.stringify(a.subs)!==JSON.stringify(b.subs))out.push('자막 설정');
 if(JSON.stringify(a.voice)!==JSON.stringify(b.voice))out.push('보이스 디렉션');
 if(JSON.stringify(a.refs)!==JSON.stringify(b.refs))out.push('전체 레퍼런스');
 if(JSON.stringify(a.thumb)!==JSON.stringify(b.thumb))out.push('썸네일');
 return out.length?out:['변경 없음']}
async function commitVersion({label='',note='',source={kind:'user'},attach=null,snapshot=null}={}){
 pushUndo.flush();if(!S.proj)return;const snap=clone(snapshot||S.proj);const n=(S.versions[0]?S.versions[0].n:0)+1;
 const v={id:'v'+pad(n,4),n,label:label||'',note:note||'',source,author:S.me.id||null,at:Date.now(),stage:snap.stage,summary:diffSummary(S.base,snap),snapshot:snap,attach:attach||null};
 const js=JSON.stringify(v);if(js.length>250000){toast('버전 데이터가 너무 큽니다. 원문 자료를 줄여 주세요.',{err:true});return null}
 try{await Store.addVersion(S.pid,v);if(!S.versions.some(x=>x.id===v.id))S.versions=[v,...S.versions];S.base=snap;S.dirty=0;scheduleSave();renderTop();toast(`v${n} 저장됨`);return v}catch(e){toast(errMsg(e),{err:true});return null}}

   <div class="field"><div class="lbl">보조 자막 <span class="hint">주 자막 아래 작게</span></div>${seg('p.subs.second',[['','없음'],...langs.filter(l=>l!==p.subs.lang).map(l=>[l,LANGS[l]])],p.subs.second)}</div>

function refsHTML(scope,list){
 return `<div class="refgrid">${list.map(r=>`<div class="ref"><div class="th">${r.kind==='image'?`<img src="${Store.url(r.assetId)}" alt="">`:r.kind==='video'?`<video src="${Store.url(r.assetId)}" muted playsinline preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()"></video>`:r.kind==='link'?`<a href="${esc(r.url)}" target="_blank" rel="noopener" style="display:grid;place-items:center;gap:4px;color:var(--accent);text-decoration:none;padding:8px;text-align:center;font-size:11px;word-break:break-all">${ic('link','l')}${esc((r.url||'').replace(/^https?:\/\//,'').slice(0,40))}</a>`:`<div style="padding:10px;font-size:12px;color:var(--fg-2);text-align:left;align-self:start">${ic('msg')}</div>`}<span class="k">${{image:'IMG',video:'VIDEO',link:'LINK',note:'NOTE'}[r.kind]}</span></div>
  <div class="rb"><input id="rt-${r.id}" data-bind="R:${scope}:${r.id}.title" value="${esc(r.title)}" placeholder="제목"><input id="rn-${r.id}" data-bind="R:${scope}:${r.id}.note" value="${esc(r.note)}" placeholder="참고할 점 (예: 색감, 컷 리듬)"><div class="row"><span class="faint" style="font-size:10.5px">${rel(r.at)}</span><button class="ibtn sm" data-act="delRef" data-arg="${scope}:${r.id}" aria-label="레퍼런스 삭제">${ic('trash','s')}</button></div></div></div>`).join('')}
 <div class="drop" data-act="addRefFiles" data-arg="${scope}" data-dropfiles="${scope}" style="min-height:150px">${ic('upload','l')}<b style="font-size:12.5px">이미지 · 영상 추가</b><span style="font-size:11px">클릭하거나 끌어다 놓기 · 20MB 이하</span></div></div>
 <div class="row" style="margin-top:10px"><button class="btn sm" data-act="addRefLink" data-arg="${scope}">${ic('link','s')}링크 추가</button><button class="btn sm" data-act="addRefNote" data-arg="${scope}">${ic('msg','s')}텍스트 메모 추가</button></div>`}

function ttsBody(p,lang,sceneBreak){return p.scenes.map(s=>s.lines.map(l=>String(l[lang]||'').trim()).filter(Boolean).join('\n')).filter(Boolean).join(sceneBreak?'\n\n':'\n')}
function styleInstruction(p){const v=p.voice;const lang=LANGS[p.tts.lang]||'Korean';const ln={ko:'Korean',ja:'Japanese',en:'English'}[p.tts.lang];
 const g={'여성':'female','남성':'male','중성적':'gender-neutral'}[v.gender]||'';const age={'20대':'in their 20s','30대':'in their 30s','40대':'in their 40s','50대+':'in their 50s or older'}[v.age]||'';
 const tones=v.tones.map(t=>(VOICE_TONES.find(x=>x[0]===t)||[t,t])[1]).join(', ');
 const pace={'느리게':'slow and unhurried','보통':'measured, natural','조금 빠르게':'brisk but clear'}[v.pace]||'measured';
 return `Read the following ${ln} narration aloud as a ${g} narrator ${age}`.replace(/\s+/g,' ').trim()+`.
Tone: ${tones||'warm, clear'}.
Pace: ${pace}${v.pauses?', with a short natural pause between sentences and a longer pause between paragraphs':''}.
Delivery: polished, clear diction suited to a ${({'cine-dark':'cinematic brand film','clean':'clean product explainer','hud':'tech explainer','editorial':'editorial film','flat':'friendly animated explainer','product':'premium product showcase'})[p.brief.style]||'motion graphics explainer'}. Do not read stage directions.${v.extra?'\n'+v.extra:''}`}

 return `<div class="wrap" style="max-width:1320px">

    <div class="field"><label for="v-name">Gemini 보이스 <span class="hint">AI Studio에서 고를 보이스 메모 · 참고용</span></label><input class="in" id="v-name" list="gvoices" data-bind="p.voice.voiceName" value="${esc(v.voiceName)}" placeholder="예: Kore"><datalist id="gvoices">${GEMINI_VOICES.map(([n,d])=>`<option value="${n}">${d}</option>`).join('')}</datalist></div>
    <div class="field"><label for="v-extra">추가 지시 (영문 권장)</label><input class="in" id="v-extra" data-bind="p.voice.extra" value="${esc(v.extra)}" placeholder="e.g. Smile slightly on the final line."></div></div></details>
  </section>
  <section class="card sec"><div class="sec-h"><h3>② 나레이션 오디오</h3>${n?`<span class="pill ok">${ic('check','s')}${tl.aligned?'타이밍 정렬됨':'업로드됨'}</span>`:''}</div>
   ${n?`<div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n.name)}</b><span class="muted mono" style="font-size:11.5px">${n.duration.toFixed(2)}s · ${esc(n.mime||'')}</span></div><button class="btn sm" data-act="narrPlay">${ic('play','s')}듣기</button><button class="btn sm" data-act="narrUpload">${ic('upload','s')}교체</button><button class="ibtn sm" data-act="narrRemove" aria-label="오디오 제거">${ic('trash','s')}</button></div>
   <canvas class="wave" id="wave" height="120"></canvas>
   <div class="row"><button class="btn pri" data-act="align">${ic('wand')}자막·씬 타이밍 자동 맞춤</button><div class="field" style="flex:1;min-width:160px"><div class="range-row"><span>영상 끝 여유</span><input type="range" id="tail" min="0" max="8" step="0.5" value="${p.tail}" style="${rangeStyle(p.tail,0,8)}" data-bind="p.tail" data-num><b>${p.tail}s</b></div></div></div>
   <p class="muted" style="font-size:12px">무음 구간을 찾아 자막 줄 수에 맞게 나눕니다. 결과가 어긋난 줄은 아래 표에서 시간을 직접 고치거나, 씬 편집 타임라인에서 경계를 끌어 조정하세요.</p>
   <div class="tbl-wrap"><table class="ltable"><thead><tr><th>#</th><th>씬</th><th>자막</th><th>시작</th><th>끝</th><th></th></tr></thead><tbody>${tl.lines.map((x,k)=>`<tr data-lid="${x.l.id}"><td class="mono muted">${k+1}</td><td class="mono" style="color:var(--accent)">${pad(x.g.i+1)}</td><td class="txt">${esc(x.l.ko)}</td><td><input type="number" step="0.01" id="ls-${x.l.id}" data-bind="L:${x.g.s.id}:${x.l.id}.start" data-num value="${x.est?'':(+x.start).toFixed(2)}" placeholder="${(+x.start).toFixed(2)}"></td><td><input type="number" step="0.01" id="le-${x.l.id}" data-bind="L:${x.g.s.id}:${x.l.id}.end" data-num value="${x.est?'':(+x.end).toFixed(2)}" placeholder="${(+x.end).toFixed(2)}"></td><td><button class="ibtn sm" data-act="playLine" data-arg="${x.start}:${x.end}" aria-label="이 줄 듣기">${ic('play','s')}</button></td></tr>`).join('')}</tbody></table></div>`
   :`<div class="drop" data-act="narrUpload" data-dropaudio style="padding:40px 18px">${ic('mic','l')}<b style="font-size:14px;color:var(--fg)">나레이션 오디오 올리기</b><span style="font-size:12px">WAV · MP3 · M4A · 14MB 이하 · 클릭하거나 끌어다 놓기</span></div>
   <p class="muted" style="font-size:12px">오디오 없이도 다음 단계로 갈 수 있어요. 그 경우 글자 수로 예측한 길이(<b>${secs(tl.total)}</b>)로 애니마틱을 만듭니다.</p>`}
   <div class="divider"></div><div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="go" data-arg="edit">씬 편집으로 ${ic('chev','s')}</button></div>
  </section></div></div>`}
MOUNT.narr=()=>{drawWave()};
function drawWave(){const cv=$('#wave');if(!cv||!S.proj.narration)return;const p=S.proj,n=p.narration;const dpr=devicePixelRatio||1;const W=cv.clientWidth,H=120;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
 const cs=getComputedStyle(document.documentElement);const acc=cs.getPropertyValue('--accent').trim(),fg=cs.getPropertyValue('--fg-2').trim(),key=cs.getPropertyValue('--key').trim();
 const tl=timeline(p);const D=Math.max(n.duration,tl.total);
 tl.segs.forEach((g,i)=>{c.fillStyle=i%2?hexA(acc.startsWith('#')?acc:'#2747E8',.08):'transparent';c.fillRect(g.start/D*W,0,(g.end-g.start)/D*W,H)});
 tl.lines.forEach(x=>{c.fillStyle=hexA(key.startsWith('#')?key:'#E8A200',.22);c.fillRect(x.start/D*W,H-10,(x.end-x.start)/D*W,8)});
 const pk=n.peaks||[];c.fillStyle=fg;const bw=W/pk.length*(n.duration/D);pk.forEach((v,i)=>{const h=Math.max(1,v*(H-24));c.fillRect(i*bw,(H-14)/2-h/2,Math.max(1,bw-.5),h)});
 c.fillStyle=acc;tl.segs.forEach((g,i)=>{if(i){c.fillRect(g.start/D*W-1,0,2,H)}c.font='600 10px IBM Plex Mono';c.fillText(pad(i+1),g.start/D*W+4,12)})}

function viewEdit(){return `<div class="ed">
 <aside class="slist" aria-label="씬 목록"><div class="slist-h"><span class="eyebrow">씬 <span id="scount"></span></span><button class="ibtn sm" data-act="addScene" title="씬 추가" aria-label="씬 추가">${ic('plus','s')}</button></div><div class="slist-b" id="slist"></div>
  <div class="slist-f"><button class="btn sm" style="width:100%" data-act="bgm">${ic('music','s')}BGM 설정</button></div></aside>
 <section class="stage" aria-label="미리보기"><div class="canvas-wrap" id="cwrap"><canvas id="cv" width="1280" height="720"></canvas></div><div class="ptool" id="ptool"></div></section>
 <aside class="insp" id="insp" aria-label="씬 속성"></aside>
 <section class="tl" id="tl" aria-label="타임라인"></section></div>`}
function mountEdit(){S.sel=clamp(S.sel,0,S.proj.scenes.length-1);renderSceneList();renderPTool();renderInspector();renderTimeline();Player.attach($('#cv'));
 const ro=new ResizeObserver(()=>{Player.fit();renderTimelineCanvases()});ro.observe($('#cwrap'));ro.observe($('#tl'))}
function selectScene(i,{seek=true}={}){S.sel=clamp(i,0,S.proj.scenes.length-1);if(seek&&!Player.playing){const g=timeline(S.proj).segs[S.sel];if(g)S.t=g.start+0.01}renderSceneList();renderInspector();renderTimeline();Player.redrawAll()}
function renderSceneList(){const el=$('#slist');if(!el)return;const tl=timeline(S.proj);$('#scount').textContent=S.proj.scenes.length;
 el.innerHTML=tl.segs.map((g,i)=>{const s=g.s;const st=s.still&&s.still.assetId;const open=s.notes.filter(n=>!n.done).length;
  return `<button class="sitem ${i===S.sel?'on':''}" data-act="sel" data-arg="${i}" draggable="true" data-drag="${s.id}"><span class="th" style="${st?`background-image:url('${Store.url(st)}')`:`background:${S.proj.brief.palette.bg}`}"><b>${pad(i+1)}</b></span><span style="min-width:0;display:grid"><span class="t" data-live="stitle" data-arg="${s.id}">${LIVE.stitle(s.id)}</span><span class="m"><span class="st ${s.status}"></span>${(g.end-g.start).toFixed(1)}s${s.locked?ic('lock','s'):''}<span style="text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.chapter)}</span></span></span>${open?`<span class="badge" title="미완료 수정 지시">${open}</span>`:''}</button>`}).join('')}
function renderPTool(){const el=$('#ptool');if(!el)return;const p=S.proj;const langs=enabledLangs(p);
 el.innerHTML=`<button class="ibtn" data-act="prevScene" title="이전 씬 (↑)" aria-label="이전 씬">${ic('prev')}</button><button class="ibtn" data-act="play" id="playbtn" title="재생/정지 (Space)" aria-label="재생">${ic(Player.playing?'pause':'play')}</button><button class="ibtn" data-act="nextScene" title="다음 씬 (↓)" aria-label="다음 씬">${ic('next')}</button>
 <span class="tc" id="tcode">${tc(S.t,p.brief.fps)} <span>/ ${tc(timeline(p).total,p.brief.fps)}</span></span><span class="sp"></span>
 <button class="ibtn ${p.subs.show?'on':''}" data-flip="p.subs.show" title="자막 보이기 (C)" aria-label="자막 보이기" aria-pressed="${p.subs.show}">${ic('cc')}</button>
 ${p.subs.show?`${seg('p.subs.lang',langs.map(l=>[l,LSHORT[l]]),p.subs.lang)}${langs.length>1?`<select id="sub2" data-bind="p.subs.second" aria-label="보조 자막"><option value="">보조 없음</option>${langs.filter(l=>l!==p.subs.lang).map(l=>`<option value="${l}" ${p.subs.second===l?'selected':''}>+ ${LANGS[l]}</option>`).join('')}</select>`:''}`:''}
 <button class="ibtn ${S.guides?'on':''}" data-act="guides" title="세이프 영역 가이드 (G)" aria-label="가이드">${ic('grid')}</button>
 <button class="ibtn ${p.bgm.preview?'on':''}" data-flip="p.bgm.preview" title="BGM 스케치 함께 듣기" aria-label="BGM 스케치" aria-pressed="${p.bgm.preview}">${ic('music')}</button>
 <button class="ibtn" data-act="fullscreen" title="전체 화면" aria-label="전체 화면">${ic('full')}</button>`}
function updateTimeUI(){const tl=timeline(S.proj);const tcEl=$('#tcode');if(tcEl)tcEl.innerHTML=`${tc(S.t,S.proj.brief.fps)} <span>/ ${tc(tl.total,S.proj.brief.fps)}</span>`;
 const ph=$('#phead');if(ph)ph.style.left=(S.t/Math.max(.01,tl.total)*100)+'%';
 const cl=tl.lines.find(x=>S.t>=x.start&&S.t<x.end);const id=cl?cl.l.id:null;if(id!==S.curLine){S.curLine=id;$$('.lcard.cur,.sub.cur,.ltable tr.cur').forEach(e=>e.classList.remove('cur'));if(id){$$(`[data-lid="${id}"]`).forEach(e=>e.classList.add('cur'))}}
 if(Player.playing&&S.view==='edit'){const i=tl.segs.findIndex(g=>S.t<g.end);const ii=i<0?tl.segs.length-1:i;if(ii!==S.sel&&!($('#insp')||{}).contains?.(document.activeElement)){S.sel=ii;renderSceneList();renderInspector();$$('.blk').forEach((b,k)=>b.classList.toggle('on',k===ii))}}}

function renderInspector(){const el=$('#insp');if(!el)return;const s=cur();if(!s){el.innerHTML='';return}const i=S.sel;const open=s.notes.filter(n=>!n.done).length;
 const keep=$('.insp-b',el);const st=keep?keep.scrollTop:0;
 el.innerHTML=`<div class="insp-h"><div class="row1"><span class="no">${pad(i+1)}</span><span class="tt" data-live="stitle" data-arg="${s.id}">${LIVE.stitle(s.id)}</span><button class="ibtn sm ${s.locked?'on':''}" data-flip="s.locked" title="${s.locked?'잠김: Claude 재생성에서 제외':'잠그기'}" aria-label="잠금" aria-pressed="${s.locked}">${ic(s.locked?'lock':'unlock','s')}</button><button class="ibtn sm" data-act="dupScene" data-arg="${s.id}" title="복제" aria-label="복제">${ic('dup','s')}</button><button class="ibtn sm" data-act="delScene" data-arg="${s.id}" title="삭제" aria-label="삭제">${ic('trash','s')}</button></div>
  <div class="row" style="justify-content:space-between">${seg('s.status',STATUS,s.status)}<span class="mono muted" style="font-size:11px">${(()=>{const g=timeline(S.proj).segs[i];return g?`${mmss(g.start)}.${String(Math.floor(g.start%1*10))} → ${mmss(g.end)} · ${(g.end-g.start).toFixed(1)}s`:''})()}</span></div></div>
 <div class="tabs" role="tablist">${[['content','내용'],['dir','연출'],['refs','레퍼런스'],['notes','수정 지시']].map(([k,n])=>`<button role="tab" aria-selected="${S.tab===k}" data-act="tab" data-arg="${k}">${n}${k==='refs'&&s.refs.length?` <span class="mono faint">${s.refs.length}</span>`:''}${k==='notes'&&open?`<span class="cnt">${open}</span>`:''}</button>`).join('')}</div>
 <div class="insp-b">${{content:inspContent,dir:inspDir,refs:inspRefs,notes:inspNotes}[S.tab](s)}</div>`;
 const nb=$('.insp-b',el);if(nb)nb.scrollTop=st;autosize(el)}

function inspContent(s){const p=S.proj;const langs=enabledLangs(p);const tl=timeline(p);const lt=new Map(tl.lines.map(x=>[x.l.id,x]));
 return `<div class="grp"><div class="grp-h"><h5>나레이션 · 자막</h5><span class="muted" style="font-size:11px">${langs.map(l=>LSHORT[l]).join(' · ')}</span></div>
 ${s.lines.map((l,k)=>{const x=lt.get(l.id);return `<div class="lcard" data-lid="${l.id}"><div class="lh"><b>${k+1}</b>${x?`<span>${x.start.toFixed(2)}–${x.end.toFixed(2)}s${x.est?' (예상)':''}</span>`:''}<span class="sp"></span>${x?`<button class="ibtn sm" data-act="seek" data-arg="${x.start}" title="이 줄로 이동" aria-label="이 줄로 이동">${ic('play','s')}</button>`:''}<button class="ibtn sm" data-act="delLine" data-arg="${l.id}" title="줄 삭제" aria-label="줄 삭제">${ic('close','s')}</button></div>
  ${langs.map(lg=>`<div class="lrow"><span>${LSHORT[lg]}</span><textarea id="lt-${l.id}-${lg}" rows="1" data-bind="L:${s.id}:${l.id}.${lg}" placeholder="${lg==='ko'?'나레이션':'번역'}">${esc(l[lg]||'')}</textarea></div>`).join('')}</div>`}).join('')}
 <div class="row"><button class="btn sm" data-act="addLine">${ic('plus','s')}줄 추가</button>${langs.length>1?`<button class="btn sm" data-act="aiTranslate" data-arg="${s.id}">${ic('spark','s')}이 씬 번역</button>`:''}</div></div>
 <div class="grp"><div class="grp-h"><h5>화면 텍스트</h5></div>

 m.querySelector('#imp-txt').addEventListener('input',check);m.querySelector('#imp-file').onclick=async()=>{const f=await pickFile('.md,.json,.txt,text/markdown,application/json');if(f){m.querySelector('#imp-txt').value=await f.text();check()}};

  else{const p=norm({...parsed.project,id:uid('p'),createdAt:Date.now(),updatedAt:Date.now()});await createProject(p,{label:'가져옴',note,source})}}}

const SCENE_SCHEMA=`{"chapter":"짧은 영문 대문자 라벨","title":"씬 제목","intent":"제작 의도","visual":"화면 구성 설명","headline":"화면 헤드라인","sub":"서브 카피(콜아웃은 · 로 구분)","position":"left|center|right|lower","lines":["자막 한 줄","..."],"energy":1-5,"tone":-2~2,"pace":1-5,"camera":"${CAMERAS.map(c=>c[0]).join('|')}","transition":"${TRANS.map(c=>c[0]).join('|')}","effects":["${EFFECTS.map(c=>c[0]).join('","')}" 중 0~4개],"textAnim":"${TEXTANIM.map(c=>c[0]).join('|')}","bgmHit":true|false}`;
function briefForAI(p){const b=p.brief;return JSON.stringify({제목:p.title,주제:b.topic,핵심메시지:b.messages.filter(Boolean),타겟:b.audience,목표길이초:b.duration,화면비:b.aspect,스타일:(STYLES.find(s=>s.k===b.style)||{}).n,제작메모:b.notes,BGM:moodWords(p.bgm),나레이션속도_초당글자:p.voice.speechRate},null,1)+(b.sourceText?`\n\n[원문 자료]\n${b.sourceText.slice(0,24000)}`:'')}
function sceneFromAI(x,base){const s=base?clone(base):newScene();const pick=(v,list,d)=>list.some(q=>q[0]===v)?v:d;
 s.chapter=String(x.chapter||s.chapter||'').slice(0,24);s.title=String(x.title||s.title||'');s.intent=String(x.intent||'');s.visual=String(x.visual||'');s.onscreen={headline:String(x.headline||''),sub:String(x.sub||''),position:pick(x.position,POSITIONS,s.onscreen.position||'left')};
 const lines=(Array.isArray(x.lines)?x.lines:String(x.lines||'').split('\n')).map(t=>String(t).trim()).filter(Boolean);
 const same=base&&base.lines.length===lines.length;s.lines=lines.length?lines.map((t,i)=>{const o=base&&base.lines[i];return {...newLine(t),...(same&&o?{id:o.id,start:o.start,end:o.end,ja:o.ko===t?o.ja:'',en:o.ko===t?o.en:''}:{})}}):[newLine()];
 s.dir={...s.dir,energy:clamp(Math.round(+x.energy||s.dir.energy),1,5),tone:clamp(Math.round(+x.tone||0),-2,2),pace:clamp(Math.round(+x.pace||3),1,5),camera:pick(x.camera,CAMERAS,s.dir.camera),transition:pick(x.transition,TRANS,s.dir.transition),textAnim:pick(x.textAnim,TEXTANIM,s.dir.textAnim),effects:(Array.isArray(x.effects)?x.effects:[]).filter(e=>EFFECTS.some(q=>q[0]===e)).slice(0,5)};
 if(typeof x.bgmHit==='boolean')s.bgmHit=x.bgmHit;return s}
function sceneForAI(s,i){return {index:i+1,id:s.id,locked:s.locked,chapter:s.chapter,title:s.title,intent:s.intent,visual:s.visual,headline:s.onscreen.headline,sub:s.onscreen.sub,position:s.onscreen.position,lines:s.lines.map(l=>l.ko).filter(Boolean),energy:s.dir.energy,tone:s.dir.tone,pace:s.dir.pace,camera:s.dir.camera,transition:s.dir.transition,effects:s.dir.effects,textAnim:s.dir.textAnim,bgmHit:s.bgmHit,openNotes:s.notes.filter(n=>!n.done).map(n=>n.text)}}
function aiRun({title,intro='',prompt,tier='default',preview,apply,applyLabel='적용'}){
 if(!Cap.sample){toast('Claude 호출은 claude.ai에서 열었을 때만 쓸 수 있어요.',{err:true});return}
 let ctl=null,result=null;
 const m=modal({title,cls:'mid',body:`${intro}<div class="row" id="ai-st"><span class="spin"></span><span>Claude가 작성 중… 처음 응답까지 10~60초 걸릴 수 있어요.</span></div><details id="ai-raw-d"><summary class="muted" style="cursor:pointer;font-size:12px">작성 중인 원문 보기</summary><pre class="ai-out" id="ai-raw"></pre></details><div id="ai-prev"></div>`,
  foot:`<button class="btn" data-stop>중단</button><button class="btn" data-retry hidden>${ic('spark','s')}다시 생성</button><button class="btn pri" data-apply hidden>${ic('check','s')}${applyLabel}</button>`,onClose:()=>{ctl&&ctl.abort()}});
 const st=m.querySelector('#ai-st'),raw=m.querySelector('#ai-raw'),pv=m.querySelector('#ai-prev'),bStop=m.querySelector('[data-stop]'),bRetry=m.querySelector('[data-retry]'),bApply=m.querySelector('[data-apply]');
 const run=async()=>{ctl=new AbortController();bStop.hidden=false;bRetry.hidden=true;bApply.hidden=true;pv.innerHTML='';raw.textContent='';st.innerHTML=`<span class="spin"></span><span>Claude가 작성 중… 처음 응답까지 10~60초 걸릴 수 있어요.</span>`;
  try{result=await Cap.sample.json(prompt,{modelTier:tier,cache:false,signal:ctl.signal,onText:({text})=>{raw.textContent=text;raw.scrollTop=raw.scrollHeight;st.innerHTML=`<span class="spin"></span><span>작성 중… ${text.length.toLocaleString()}자</span>`}});
   st.innerHTML=`<span class="pill ok">${ic('check','s')}완료</span><span class="muted" style="font-size:12px">내용을 확인하고 적용하세요. 적용하면 Claude 출처 태그가 붙은 새 버전이 만들어집니다.</span>`;pv.innerHTML=preview(result);bApply.hidden=false;bRetry.hidden=false;bStop.hidden=true}
  catch(e){bStop.hidden=true;bRetry.hidden=false;st.innerHTML=`<span class="pill bad">!</span><span>${esc(errMsg(e))}</span>`;if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'))bRetry.hidden=true}};
 bStop.onclick=()=>{ctl&&ctl.abort()};bRetry.onclick=run;bApply.onclick=async()=>{bApply.disabled=true;try{await apply(result);m.close()}catch(e){console.error(e);toast('적용하지 못했어요: '+errMsg(e),{err:true});bApply.disabled=false}};run()}
function scenesPreview(list){return `<div class="diff">${list.map((x,i)=>`<div class="d"><h6><span class="mono" style="color:var(--accent)">${pad(i+1)}</span> ${esc(x.chapter||'')} · ${esc(x.title||'')}</h6><div style="font-size:12.5px">${(x.lines||[]).map(esc).join('<br>')}</div><div class="muted" style="font-size:11.5px">${esc(x.headline||'')}${x.intent?' — '+esc(x.intent):''}</div></div>`).join('')}</div>`}
function aiDraft(){const p=S.proj;const has=p.scenes.some(s=>s.lines.some(l=>l.ko.trim()));let n='auto';
 const m=modal({title:'Claude로 스크립트 초안 만들기',body:`<p class="muted">기획 내용을 바탕으로 씬 구성, 나레이션, 화면 텍스트, 연출 제안까지 한 번에 만듭니다.${has?' <b style="color:var(--warn)">잠기지 않은 기존 씬은 새 초안으로 바뀝니다</b> (지금 상태는 버전으로 먼저 저장돼요).':''}</p>
  <div class="field"><div class="lbl">씬 개수</div><div class="seg" id="ai-n">${[['auto','자동'],[3,'3'],[4,'4'],[5,'5'],[6,'6'],[8,'8']].map(([k,l])=>`<button aria-pressed="${k==='auto'}" data-k="${k}">${l}</button>`).join('')}</div></div>

  foot:`<button class="btn" data-no>취소</button><button class="btn ai" data-ok>${ic('spark','s')}초안 만들기</button>`});
 m.querySelector('#ai-n').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;n=b.dataset.k;$$('#ai-n button').forEach(c=>c.setAttribute('aria-pressed',String(c===b)))};m.querySelector('[data-no]').onclick=()=>m.close();
 m.querySelector('[data-ok]').onclick=()=>{const extra=$('#ai-extra').value.trim();m.close();
  const prompt=`당신은 모션그래픽 영상 기획자이자 카피라이터입니다. 아래 기획으로 약 ${p.brief.duration}초 길이의 모션그래픽 씬 구성과 한국어 나레이션을 작성하세요.

규칙
- 씬 수: ${n==='auto'?'내용에 맞게 3~8개':n+'개'}. 기승전결이 있도록 도입-전개-정점-마무리 흐름.
- 나레이션은 소리 내어 읽기 자연스러운 구어체. lines 배열의 각 항목이 자막 한 줄이며 공백 포함 26자 이내로 의미 단위에서 끊기.
- 전체 나레이션 분량: 공백 제외 약 ${Math.round(p.brief.duration*(p.voice.speechRate||6)*0.82)}자 (초당 ${p.voice.speechRate||6}자 기준, 씬 전환 여유 포함).
- headline은 화면에 크게 뜨는 짧은 문구(12자 이내 권장), chapter는 VALUE·SENSING 같은 영문 대문자 한 단어.
- 연출 값은 씬의 감정에 맞게. 정점 씬은 energy 5, 마지막 씬은 차분하게. bgmHit은 장면 분위기가 크게 바뀌는 씬에만 true.
- 원문에 없는 사실·수치를 지어내지 말 것.${extra?`\n- 추가 지시: ${extra}`:''}

출력: JSON만. 형식 {"scenes":[${SCENE_SCHEMA}]}

[기획]
${briefForAI(p)}`;
  aiRun({title:'스크립트 초안',prompt,preview:r=>scenesPreview((r&&r.scenes)||[]),applyLabel:'초안 적용',apply:async r=>{const list=(r&&r.scenes)||[];if(!list.length)throw {message:'씬이 비어 있어요'};
   if(has&&S.dirty)await commitVersion({label:'초안 생성 전 자동 저장',source:{kind:'user'}});
   const locked=p.scenes.filter(s=>s.locked);const gen=list.map(x=>sceneFromAI(x));let out=[];
   if(locked.length){let gi=0;p.scenes.forEach(s=>{if(s.locked)out.push(s);else if(gi<gen.length)out.push(gen[gi++])});while(gi<gen.length)out.push(gen[gi++])}else out=gen;
   p.scenes=out;p.scenes.forEach(s=>{if(!s.locked){s.start=null;s.end=null}});S.sel=0;await commitVersion({label:'Claude 초안',note:extra||'기획 기반 스크립트 초안 생성',source:{kind:'web',agent:'Claude (웹 내 생성)'}});go('script')}})}}
function aiScene(sid){const p=S.proj;const i=p.scenes.findIndex(s=>s.id===sid);const s=p.scenes[i];if(!s)return;if(s.locked)return toast('잠긴 씬이에요. 잠금을 풀고 다시 시도하세요.');
 const typed=($('#newnote')&&$('#newnote').value.trim())||'';const open=s.notes.filter(n=>!n.done).map(n=>n.text);
 const m=modal({title:`씬 ${i+1} 다시 쓰기`,body:`${open.length?`<div class="field"><div class="lbl">함께 반영할 미완료 지시</div><ul style="margin:0;padding-left:18px;font-size:12.5px">${open.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}<div class="field"><label for="ai-ins">수정 지시</label><textarea class="ta" id="ai-ins" rows="4" placeholder="예: 더 짧고 단호하게, 헤드라인은 질문형으로">${esc(typed)}</textarea></div><p class="muted" style="font-size:12px">스틸·레퍼런스는 유지되고, 줄 수가 같으면 자막 타이밍과 번역도 유지됩니다.</p>`,

function detectGaps(buf){const ch=buf.getChannelData(0);const sr=buf.sampleRate;const hop=Math.round(sr*.01);const n=Math.floor(ch.length/hop);const rms=new Float32Array(n);
 for(let i=0;i<n;i++){let s=0;for(let k=i*hop;k<(i+1)*hop;k+=2)s+=ch[k]*ch[k];rms[i]=Math.sqrt(s/(hop/2))}
 const sorted=Array.from(rms).sort((a,b)=>a-b);const floor=sorted[Math.floor(n*.1)]||0,peak=sorted[Math.floor(n*.95)]||1;const thr=floor+(peak-floor)*.1;
 const sil=Array.from(rms,v=>v<thr);let ss=sil.indexOf(false),se=sil.lastIndexOf(false);if(ss<0){ss=0;se=n-1}
 const gaps=[];let i=ss;while(i<=se){if(sil[i]){let j=i;while(j<=se&&sil[j])j++;const len=(j-i)*.01;if(len>=.12)gaps.push({s:i*.01,e:j*.01,c:(i+j)/2*.01,len});i=j}else i++}

async function alignNarration(){const p=S.proj;if(!p.narration)return toast('먼저 나레이션 오디오를 올려 주세요');let buf;try{buf=await audioBuffer(p.narration.assetId)}catch(e){return toast('오디오를 읽지 못했어요',{err:true})}
 const items=[];p.scenes.forEach((s,si)=>s.lines.forEach(l=>{if(l.ko.trim())items.push({s,si,l,ch:Math.max(1,nonspace(l.ko))})}));const N=items.length;if(!N)return toast('나레이션 줄이 없어요');

 let cuts=[];

  const INF=1e9;const dp=Array.from({length:K},()=>new Float64Array(G).fill(INF));const bk=Array.from({length:K},()=>new Int32Array(G).fill(-1));

  let j=-1,b=INF;for(let x=0;x<G;x++)if(dp[K-1][x]<b){b=dp[K-1][x];j=x}for(let k=K-1;k>=0;k--){cuts[k]=gaps[j];j=bk[k][j]}}
 else if(K>0){cuts=exp.map(e=>({s:e-.05,e:e+.05,c:e}));toast('무음 구간이 부족해 글자 수 비율로 나눴어요. 표에서 확인해 주세요.',{ms:6000})}
 items.forEach((x,k)=>{x.l.start=+(k?cuts[k-1].e-.04:Math.max(0,ss-.05)).toFixed(3);x.l.end=+(k<K?cuts[k].s+.06:Math.min(buf.duration,se+.05)).toFixed(3)});
